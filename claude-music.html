<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Music</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --green: #1db954;
    --green-dim: #158a3e;
    --text: #f0f0f0;
    --muted: #666;
    --accent: #1db954;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  .container {
    width: 100%;
    max-width: 680px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 48px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    margin-left: 4px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .tag {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 2px;
  }

  /* Login screen */
  #login-screen {
    text-align: center;
    padding: 80px 0;
  }

  #login-screen h2 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  #login-screen p {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 3px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    text-decoration: none;
  }

  .btn:hover { background: #1ed760; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px 20px;
    font-size: 13px;
  }

  .btn-ghost:hover { background: var(--surface2); color: var(--text); transform: none; }

  /* Main app */
  #app { display: none; width: 100%; }

  /* Now playing */
  .now-playing {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .now-playing::before {
    content: 'NOW PLAYING';
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--green);
    font-weight: 500;
  }

  .track-info {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 20px;
  }

  .album-art {
    width: 64px;
    height: 64px;
    border-radius: 2px;
    background: var(--surface2);
    flex-shrink: 0;
    object-fit: cover;
  }

  .album-art-placeholder {
    width: 64px;
    height: 64px;
    border-radius: 2px;
    background: var(--surface2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 22px;
  }

  .track-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 400px;
  }

  .track-artist {
    font-size: 13px;
    color: var(--muted);
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 20px;
  }

  .progress-bar-bg {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    width: 0%;
    transition: width 0.5s linear;
  }

  .progress-times {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
  }

  .ctrl-btn:hover { border-color: var(--green); color: var(--green); }

  .ctrl-btn.active { border-color: var(--green); color: var(--green); background: rgba(29,185,84,0.08); }

  .play-btn {
    width: 48px;
    height: 48px;
    background: var(--green);
    border: none;
    color: #000;
    font-size: 18px;
    border-radius: 2px;
  }

  .play-btn:hover { background: #1ed760; color: #000; }

  .volume-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .volume-wrap span { font-size: 14px; color: var(--muted); }

  input[type=range] {
    -webkit-appearance: none;
    width: 80px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--green);
    cursor: pointer;
  }

  /* Search */
  .search-section {
    margin-bottom: 24px;
  }

  .search-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: block;
  }

  .search-row {
    display: flex;
    gap: 8px;
  }

  .search-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--green); }
  .search-input::placeholder { color: var(--muted); }

  /* Results */
  .results {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .result-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .result-item:hover {
    border-color: var(--border);
    background: var(--surface2);
  }

  .result-item:hover .play-icon { opacity: 1; }

  .result-num {
    font-size: 11px;
    color: var(--muted);
    width: 20px;
    text-align: right;
    flex-shrink: 0;
  }

  .result-thumb {
    width: 40px;
    height: 40px;
    border-radius: 2px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface2);
  }

  .result-text { flex: 1; min-width: 0; }

  .result-title {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-meta {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-duration {
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .play-icon {
    font-size: 16px;
    color: var(--green);
    opacity: 0;
    flex-shrink: 0;
    transition: opacity 0.12s;
  }

  .status-msg {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 13px;
  }

  .error { color: #e05; }

  /* Recommendations section */
  .rec-section {
    margin-top: 24px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Claude Music<span class="dot"></span></h1>
    <span class="tag">dev mode</span>
  </header>

  <!-- Login -->
  <div id="login-screen">
    <h2>Connect Spotify</h2>
    <p>Authorise access to search and control<br>your Spotify playback.</p>
    <button class="btn" onclick="login()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
      Connect with Spotify
    </button>
  </div>

  <!-- Main App -->
  <div id="app">
    <!-- Now Playing -->
    <div class="now-playing" id="now-playing">
      <div class="track-info">
        <div class="album-art-placeholder" id="art-placeholder">♪</div>
        <img class="album-art" id="album-art" style="display:none" src="" alt="">
        <div>
          <div class="track-name" id="track-name">Nothing playing</div>
          <div class="track-artist" id="track-artist">—</div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar-bg" id="progress-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="btn-shuffle" onclick="toggleShuffle()" title="Shuffle">⇄</button>
        <button class="ctrl-btn" onclick="prevTrack()" title="Previous">⏮</button>
        <button class="ctrl-btn play-btn" id="btn-play" onclick="togglePlay()" title="Play/Pause">▶</button>
        <button class="ctrl-btn" onclick="nextTrack()" title="Next">⏭</button>
        <button class="ctrl-btn" id="btn-repeat" onclick="toggleRepeat()" title="Repeat">↻</button>
        <div class="volume-wrap">
          <span>🔊</span>
          <input type="range" id="volume-slider" min="0" max="100" value="70" oninput="setVolume(this.value)">
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-section">
      <span class="search-label">Search</span>
      <div class="search-row">
        <input class="search-input" id="search-input" type="text" placeholder="track, artist, album..." onkeydown="if(event.key==='Enter') search()">
        <button class="btn" onclick="search()">Go</button>
      </div>
    </div>

    <!-- Results -->
    <div id="results-area">
      <div class="status-msg">Search for something, or I'll suggest tracks based on your taste.</div>
    </div>

    <!-- Quick recs -->
    <div class="rec-section">
      <div class="section-header">
        <span class="search-label" style="margin:0">Quick picks for you</span>
        <button class="btn btn-ghost" onclick="loadRecs()">Refresh</button>
      </div>
      <div id="recs-area"><div class="status-msg">Loading suggestions...</div></div>
    </div>
  </div>
</div>

<script>
const CLIENT_ID = '01b04987a6014a46808ec4d4749d8cdc';
const REDIRECT_URI = 'https://berticustoofly.github.io/claude-music/claude-music.html';
const SCOPES = [
  'streaming',
  'user-read-email',
  'user-read-private',
  'user-read-playback-state',
  'user-modify-playback-state',
  'user-read-currently-playing',
  'user-library-read'
].join(' ');

let accessToken = null;
let playerState = { playing: false, shuffle: false, repeat: false };
let pollInterval = null;

// ── Auth ──────────────────────────────────────────────
function generateCodeVerifier() {
  const array = new Uint8Array(64);
  crypto.getRandomValues(array);
  return btoa(String.fromCharCode(...array)).replace(/[^a-zA-Z0-9]/g, '').slice(0, 128);
}

async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function login() {
  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('pkce_verifier', verifier);

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge,
  });

  window.location.href = `https://accounts.spotify.com/authorize?${params}`;
}

async function exchangeCode(code) {
  const verifier = localStorage.getItem('pkce_verifier');
  document.getElementById('login-screen').innerHTML = '<p style="margin-top:80px;font-family:Syne,sans-serif;font-size:18px">Connecting to Spotify...</p>';
  try {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier,
      })
    });
    const data = await res.json();
    console.log('Spotify token response:', JSON.stringify(data));
    if (data.access_token) {
      accessToken = data.access_token;
      localStorage.setItem('spotify_token', accessToken);
      localStorage.setItem('spotify_token_expiry', Date.now() + data.expires_in * 1000);
      if (data.refresh_token) localStorage.setItem('spotify_refresh', data.refresh_token);
      window.history.replaceState({}, '', window.location.pathname);
      showApp();
    } else {
      document.getElementById('login-screen').innerHTML = '<p style="margin-top:80px;color:#e05;font-size:13px">Auth error: ' + (data.error||'unknown') + ' — ' + (data.error_description||'') + '</p><br><button class="btn" onclick="location.href=location.pathname">Try again</button>';
    }
  } catch(e) {
    document.getElementById('login-screen').innerHTML = '<p style="margin-top:80px;color:#e05;font-size:13px">Error: ' + e.message + '</p><br><button class="btn" onclick="location.href=location.pathname">Try again</button>';
  }
}

async function refreshToken() {
  const refresh = localStorage.getItem('spotify_refresh');
  if (!refresh) return false;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: refresh,
    })
  });
  const data = await res.json();
  if (data.access_token) {
    accessToken = data.access_token;
    localStorage.setItem('spotify_token', accessToken);
    localStorage.setItem('spotify_token_expiry', Date.now() + data.expires_in * 1000);
    return true;
  }
  return false;
}

async function api(path, opts = {}) {
  const expiry = localStorage.getItem('spotify_token_expiry');
  if (expiry && Date.now() > expiry - 60000) await refreshToken();
  const res = await fetch(`https://api.spotify.com/v1${path}`, {
    ...opts,
    headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (res.status === 204 || res.status === 202) return null;
  if (!res.ok) return null;
  return res.json();
}

// ── UI ────────────────────────────────────────────────
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  startPolling();
  loadRecs();
}

function fmtMs(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

async function updateNowPlaying() {
  const data = await api('/me/player');
  if (!data || !data.item) return;

  const track = data.item;
  document.getElementById('track-name').textContent = track.name;
  document.getElementById('track-artist').textContent = track.artists.map(a => a.name).join(', ');

  const img = track.album.images[1] || track.album.images[0];
  if (img) {
    document.getElementById('album-art').src = img.url;
    document.getElementById('album-art').style.display = 'block';
    document.getElementById('art-placeholder').style.display = 'none';
  }

  const pct = (data.progress_ms / track.duration_ms) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('time-current').textContent = fmtMs(data.progress_ms);
  document.getElementById('time-total').textContent = fmtMs(track.duration_ms);

  document.getElementById('btn-play').textContent = data.is_playing ? '⏸' : '▶';
  document.getElementById('btn-shuffle').classList.toggle('active', data.shuffle_state);
  document.getElementById('btn-repeat').classList.toggle('active', data.repeat_state !== 'off');

  playerState.playing = data.is_playing;
  playerState.shuffle = data.shuffle_state;
  playerState.repeat = data.repeat_state !== 'off';
}

function startPolling() {
  updateNowPlaying();
  pollInterval = setInterval(updateNowPlaying, 3000);
}

// ── Controls ──────────────────────────────────────────
async function togglePlay() {
  if (playerState.playing) {
    await api('/me/player/pause', { method: 'PUT' });
  } else {
    await api('/me/player/play', { method: 'PUT' });
  }
  setTimeout(updateNowPlaying, 300);
}

async function nextTrack() {
  await api('/me/player/next', { method: 'POST' });
  setTimeout(updateNowPlaying, 500);
}

async function prevTrack() {
  await api('/me/player/previous', { method: 'POST' });
  setTimeout(updateNowPlaying, 500);
}

async function toggleShuffle() {
  const next = !playerState.shuffle;
  await api(`/me/player/shuffle?state=${next}`, { method: 'PUT' });
  setTimeout(updateNowPlaying, 300);
}

async function toggleRepeat() {
  const next = playerState.repeat ? 'off' : 'track';
  await api(`/me/player/repeat?state=${next}`, { method: 'PUT' });
  setTimeout(updateNowPlaying, 300);
}

async function setVolume(v) {
  await api(`/me/player/volume?volume_percent=${v}`, { method: 'PUT' });
}

async function playTrack(uri) {
  await api('/me/player/play', {
    method: 'PUT',
    body: JSON.stringify({ uris: [uri] })
  });
  setTimeout(updateNowPlaying, 800);
}

// ── Search ────────────────────────────────────────────
async function search() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  document.getElementById('results-area').innerHTML = '<div class="status-msg">Searching...</div>';
  const data = await api(`/search?q=${encodeURIComponent(q)}&type=track&limit=8`);
  if (!data || !data.tracks || !data.tracks.items.length) {
    document.getElementById('results-area').innerHTML = '<div class="status-msg error">No results found.</div>';
    return;
  }
  renderTracks(data.tracks.items, 'results-area');
}

function renderTracks(tracks, containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'results fade-in';
  tracks.forEach((t, i) => {
    const img = t.album.images[2] || t.album.images[0];
    const item = document.createElement('div');
    item.className = 'result-item';
    item.onclick = () => playTrack(t.uri);
    item.innerHTML = `
      <span class="result-num">${i+1}</span>
      ${img ? `<img class="result-thumb" src="${img.url}" alt="">` : '<div class="result-thumb"></div>'}
      <div class="result-text">
        <div class="result-title">${t.name}</div>
        <div class="result-meta">${t.artists.map(a=>a.name).join(', ')} · ${t.album.name}</div>
      </div>
      <span class="result-duration">${fmtMs(t.duration_ms)}</span>
      <span class="play-icon">▶</span>
    `;
    div.appendChild(item);
  });
  el.appendChild(div);
}

// ── Recommendations ───────────────────────────────────
// Seed tracks based on your taste from the screenshots
const SEED_TRACKS_QUERIES = [
  'Tyler The Creator Earfquake',
  'Frank Ocean Chanel',
  'MF DOOM Accordion',
  'Brent Faiyaz Clouded',
  'Mac Miller Circles'
];

async function loadRecs() {
  document.getElementById('recs-area').innerHTML = '<div class="status-msg">Finding tracks...</div>';

  // Get seed track IDs
  const seedIds = [];
  for (const q of SEED_TRACKS_QUERIES.slice(0, 3)) {
    const data = await api(`/search?q=${encodeURIComponent(q)}&type=track&limit=1`);
    if (data?.tracks?.items?.[0]) seedIds.push(data.tracks.items[0].id);
  }

  if (!seedIds.length) {
    document.getElementById('recs-area').innerHTML = '<div class="status-msg error">Couldn\'t load recommendations.</div>';
    return;
  }

  const data = await api(`/recommendations?seed_tracks=${seedIds.slice(0,5).join(',')}&limit=8&target_energy=0.6&target_valence=0.45`);
  if (!data?.tracks?.length) {
    document.getElementById('recs-area').innerHTML = '<div class="status-msg error">No recommendations found.</div>';
    return;
  }
  renderTracks(data.tracks, 'recs-area');
}

// ── Init ──────────────────────────────────────────────
(async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code) {
    await exchangeCode(code);
    return;
  }

  const token = localStorage.getItem('spotify_token');
  const expiry = localStorage.getItem('spotify_token_expiry');

  if (token && expiry && Date.now() < expiry) {
    accessToken = token;
    showApp();
  } else if (localStorage.getItem('spotify_refresh')) {
    const ok = await refreshToken();
    if (ok) showApp();
  }
})();
</script>
